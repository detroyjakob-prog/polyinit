[package]
name = "{{project_name}}"
version = "0.1.0"
edition = "2021"
description = "A Rust web API generated by pinit."
readme = "README.md"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"